name: Test

on:
  # Trigger the workflow on push or pull request, but only for the master branch
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 2.0.9
      - name: Run tests
        run: sbt "test;shutdown"
      - name: Run example-esbuild tests
        run: |
          cd example-esbuild
          sbt "test;shutdown"
